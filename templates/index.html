<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Emotion Detector</h1>
            <p class="subtitle">AI-powered Emotion Analysis using Watson NLP</p>
        </header>

        <main class="card">
            <label for="textToAnalyze">Enter the text you want to analyze:</label>
            <textarea id="textToAnalyze" rows="4" placeholder="Type or paste your text here..."></textarea>
            <button id="submitBtn" onclick="RunSentimentAnalysis()">Analyze Emotion</button>

            <section class="result-section">
                <h2>System Response:</h2>
                <div id="system_response" class="response-box">Awaiting text submission...</div>
            </section>
        </main>
    </div>
</body>
</html>
